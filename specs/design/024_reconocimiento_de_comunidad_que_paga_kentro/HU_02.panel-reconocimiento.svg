<svg xmlns="http://www.w3.org/2000/svg" width="375" height="1290" viewBox="0 0 375 1290" role="img" aria-labelledby="t">
  <title id="t">HU_02 movil: panel del lider de ADMA con el reconocimiento de Kentro separado del cashback</title>
  <style>
    text{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;fill:#f4f6f8;font-size:12px}
    .m{fill:#9aa5b3}.sb{font-weight:600}.b{font-weight:700}.xb{font-weight:800}
    .deep{fill:#10140c}.rust{fill:#ff8b7c}.mint{fill:#c6f24e}.acid{fill:#c6f24e}
    .tab{font-variant-numeric:tabular-nums}
  </style>
  <rect width="375" height="1290" fill="#0e1116"/>

  <text x="16" y="42" font-size="26" class="xb" letter-spacing="-0.9">Mi comunidad</text>
  <text x="16" y="64" font-size="13" class="m">ADMA</text>
  <circle cx="341" cy="36" r="18" fill="#212832" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="341" y="40" text-anchor="middle" class="sb">AC</text>

  <!-- Periodo -->
  <rect x="16" y="84" width="343" height="150" rx="24" fill="#191e25" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="32" y="112" class="m">Desde</text>
  <rect x="32" y="120" width="149" height="44" rx="14" fill="#212832"/>
  <text x="46" y="147" font-size="14" class="tab">27/04/2026</text>
  <text x="194" y="112" class="m">Hasta</text>
  <rect x="194" y="120" width="149" height="44" rx="14" fill="#212832"/>
  <text x="208" y="147" font-size="14" class="tab">02/10/2026</text>
  <text x="32" y="192" class="m">Tu enlace de invitacion:</text>
  <text x="32" y="210" class="acid">kentro-last-mile.web.app/registro/adma</text>

  <!-- KPI de pedidos -->
  <g>
    <rect x="16" y="250" width="167" height="84" rx="16" fill="#191e25" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="30" y="274" font-size="11" class="m">Pedidos creados</text><text x="30" y="289" font-size="11" class="m">(fecha de creacion)</text>
    <text x="30" y="320" font-size="22" class="b tab">1.284</text>
    <rect x="192" y="250" width="167" height="84" rx="16" fill="#191e25" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="206" y="274" font-size="11" class="m">Despachados</text><text x="206" y="289" font-size="11" class="m">(fecha de despacho)</text>
    <text x="206" y="320" font-size="22" class="b tab">1.231</text>
    <rect x="16" y="342" width="167" height="84" rx="16" fill="#191e25" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="30" y="366" font-size="11" class="m">Entregados</text><text x="30" y="381" font-size="11" class="m">(fecha de cierre)</text>
    <text x="30" y="412" font-size="22" class="b tab">1.012</text>
    <rect x="192" y="342" width="167" height="84" rx="16" fill="#191e25" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="206" y="366" font-size="11" class="m">Fallidos</text><text x="206" y="381" font-size="11" class="m">(fecha de cierre)</text>
    <text x="206" y="412" font-size="22" class="b tab">168</text>
  </g>

  <!-- Tu cashback (lo de hoy, sin cambios de concepto) -->
  <rect x="16" y="442" width="343" height="170" rx="24" fill="#191e25" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="32" y="472" font-size="16" class="b">Tu cashback</text>
  <text x="32" y="492" class="m">Sale del precio que fijas a tus tiendas.</text>
  <line x1="32" y1="506" x2="343" y2="506" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="32" y="530" class="m">Causado (fecha de cierre)</text><text x="343" y="531" text-anchor="end" font-size="17" class="b tab">$0</text>
  <text x="32" y="562" class="m">Ya pagado</text><text x="343" y="563" text-anchor="end" font-size="17" class="b tab">$0</text>
  <text x="32" y="594" class="m">Pendiente</text><text x="343" y="595" text-anchor="end" font-size="17" class="b tab">$0</text>

  <!-- Reconocimiento de Kentro (nuevo) -->
  <rect x="16" y="628" width="343" height="318" rx="24" fill="#191e25" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="32" y="658" font-size="16" class="b">Reconocimiento de Kentro</text>
  <circle cx="331" cy="653" r="16" fill="#212832"/>
  <text x="331" y="658" text-anchor="middle" font-size="14" class="b">?</text>
  <text x="32" y="680" class="m">Kentro te reconoce <tspan class="tab sb" fill="#f4f6f8">$1.000</tspan> por cada pedido</text>
  <text x="32" y="696" class="m">entregado o fallido cobrado de tus tiendas.</text>
  <text x="32" y="712" class="m">Lo paga Kentro: tus tiendas no pagan mas.</text>
  <line x1="32" y1="726" x2="343" y2="726" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="32" y="750" class="m">Pedidos reconocidos (fecha de cierre)</text><text x="343" y="751" text-anchor="end" font-size="17" class="b tab">167</text>
  <text x="32" y="782" class="m">Causado</text><text x="343" y="783" text-anchor="end" font-size="17" class="b tab">$167.000</text>
  <text x="32" y="814" class="m">Ya pagado</text><text x="343" y="815" text-anchor="end" font-size="17" class="b tab">$144.000</text>
  <text x="32" y="846" class="m">Pendiente</text><text x="343" y="847" text-anchor="end" font-size="17" class="b tab mint">$23.000</text>
  <text x="32" y="872" font-size="11" class="m">Pagado y pendiente: de lo causado en estas fechas.</text>
  <rect x="32" y="886" width="311" height="44" rx="12" fill="#212832"/>
  <text x="44" y="905" class="m">ADMA COMERCIAL, tu tienda, no causa</text>
  <text x="44" y="921" class="m">reconocimiento.</text>

  <!-- Entrega -->
  <rect x="16" y="962" width="343" height="78" rx="24" fill="#191e25" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="32" y="992" font-size="14" class="sb">Entrega: <tspan class="tab">85,8%</tspan> <tspan font-size="12" font-weight="400" class="m">sobre 1.180 cerrados</tspan></text>
  <text x="32" y="1018" class="m">8 tiendas activas · 1 sin pedidos en el periodo</text>

  <!-- Como va cada tienda (resumido, sin cambios) -->
  <rect x="16" y="1056" width="343" height="218" rx="24" fill="#191e25" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="32" y="1086" font-size="14" class="sb">Como va cada tienda</text>
  <rect x="32" y="1100" width="311" height="72" rx="14" fill="#212832"/>
  <text x="44" y="1124" font-size="13" class="sb">Casa Nativa</text><text x="331" y="1124" text-anchor="end" font-size="13" class="sb tab">88%</text>
  <text x="44" y="1146" class="m tab">412 creados · 360 entregados · 49 fallidos</text>
  <rect x="32" y="1180" width="311" height="72" rx="14" fill="#212832"/>
  <text x="44" y="1204" font-size="13" class="sb">Glowy Skin</text><text x="331" y="1204" text-anchor="end" font-size="13" class="sb tab">84%</text>
  <text x="44" y="1226" class="m tab">298 creados · 236 entregados · 45 fallidos</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <title>HU_01 - Conexion Shopify que acepta todos los productos (tienda, movil)</title>
  <defs>
    <radialGradient id="ga" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#c6f24e" stop-opacity="0.12"/><stop offset="1" stop-color="#c6f24e" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7cc4ff" stop-opacity="0.10"/><stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    text{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
    .n{font-variant-numeric:tabular-nums}
  </style>
  <rect width="375" height="812" fill="#0e1116"/>
  <circle cx="60" cy="160" r="200" fill="url(#ga)"/>
  <circle cx="340" cy="560" r="220" fill="url(#gb)"/>

  <!-- Cabecera -->
  <rect x="0" y="0" width="375" height="56" fill="#0e1116" fill-opacity="0.92"/>
  <circle cx="32" cy="28" r="15" fill="#c6f24e"/>
  <text x="32" y="33" text-anchor="middle" font-size="14" font-weight="800" fill="#10140c">K</text>
  <text x="56" y="34" font-size="17" font-weight="800" fill="#f4f6f8">Kentro</text>
  <circle cx="343" cy="28" r="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="343" y="32" text-anchor="middle" font-size="12" font-weight="700" fill="#f4f6f8">IN</text>

  <text x="16" y="94" font-size="26" font-weight="800" fill="#f4f6f8" letter-spacing="-0.9">Integraciones</text>

  <!-- Tarjeta Conexion Shopify (h2) -->
  <rect x="16" y="112" width="343" height="688" rx="24" fill="#191e25" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="32" y="144" font-size="16" font-weight="700" fill="#f4f6f8">Conexion Shopify</text>

  <!-- Bloque Webhook de sincronizacion (h3) -->
  <rect x="28" y="158" width="319" height="630" rx="16" fill="#212832"/>
  <text x="44" y="186" font-size="15" font-weight="700" fill="#f4f6f8">Webhook de sincronizacion</text>
  <text x="44" y="206" font-size="12" fill="#9aa5b3">Configura la misma URL en Shopify para Order</text>
  <text x="44" y="222" font-size="12" fill="#9aa5b3">creation y Order update.</text>

  <!-- Frase del filtro (role=status) -->
  <rect x="44" y="236" width="287" height="70" rx="16" fill="#c6f24e" fill-opacity="0.07" stroke="#c6f24e" stroke-opacity="0.5"/>
  <circle cx="64" cy="258" r="9" fill="none" stroke="#c6f24e" stroke-width="1.8"/>
  <path d="M59.5 258 l3 3 l5.5 -6" fill="none" stroke="#c6f24e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="82" y="263" font-size="14" font-weight="700" fill="#f4f6f8">Entran todos tus productos.</text>
  <text x="82" y="283" font-size="13" fill="#cbd3dc">Solo se descartan pedidos fuera</text>
  <text x="82" y="299" font-size="13" fill="#cbd3dc">de Cali.</text>

  <!-- Cambiar filtro (secundario) -->
  <rect x="44" y="318" width="150" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
  <path d="M60 334 h14 M62 340 h10 M64 346 h6" stroke="#cbd3dc" stroke-width="1.8" stroke-linecap="round"/>
  <text x="82" y="345" font-size="14" font-weight="600" fill="#f4f6f8">Cambiar filtro</text>

  <line x1="44" y1="378.5" x2="331" y2="378.5" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- URL de solo lectura -->
  <text x="44" y="402" font-size="12" font-weight="600" fill="#9aa5b3">URL del webhook</text>
  <rect x="44" y="410" width="287" height="44" rx="16" fill="#191e25" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="58" y="437" font-size="12" fill="#cbd3dc">https://us-central1-kentro-last-mile.clo...</text>

  <!-- Acciones de la URL -->
  <rect x="44" y="466" width="128" height="44" rx="22" fill="#c6f24e"/>
  <text x="108" y="493" text-anchor="middle" font-size="14" font-weight="700" fill="#10140c">Copiar URL</text>
  <rect x="180" y="466" width="151" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="255.5" y="493" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f6f8">Actualizar webhook</text>

  <!-- Advertencia breve (informativa) -->
  <rect x="44" y="524" width="287" height="78" rx="16" fill="#7cc4ff" fill-opacity="0.06" stroke="#7cc4ff" stroke-opacity="0.35"/>
  <circle cx="62" cy="546" r="8" fill="none" stroke="#7cc4ff" stroke-width="1.6"/>
  <line x1="62" y1="543" x2="62" y2="550" stroke="#7cc4ff" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="62" cy="540" r="1.1" fill="#7cc4ff"/>
  <text x="78" y="550" font-size="12" fill="#f4f6f8">Si editas en Shopify un pedido viejo de</text>
  <text x="78" y="567" font-size="12" fill="#f4f6f8">Cali, entra a Kentro como pedido nuevo</text>
  <text x="78" y="584" font-size="12" fill="#f4f6f8">sin confirmar. Puedes borrarlo sin costo.</text>

  <!-- Instrucciones Shopify -->
  <rect x="44" y="614" width="287" height="160" rx="16" fill="#191e25"/>
  <text x="58" y="640" font-size="13" font-weight="700" fill="#f4f6f8">Instrucciones Shopify</text>
  <text x="58" y="664" font-size="12" fill="#9aa5b3">1. Crear webhook Order creation con esta</text>
  <text x="70" y="681" font-size="12" fill="#9aa5b3">URL.</text>
  <text x="58" y="703" font-size="12" fill="#9aa5b3">2. Crear webhook Order update con esta</text>
  <text x="70" y="720" font-size="12" fill="#9aa5b3">misma URL.</text>
  <text x="58" y="742" font-size="12" fill="#9aa5b3">3. Para traer un pedido viejo, abrelo en</text>
  <text x="70" y="759" font-size="12" fill="#9aa5b3">Shopify y guardalo.</text>
</svg>

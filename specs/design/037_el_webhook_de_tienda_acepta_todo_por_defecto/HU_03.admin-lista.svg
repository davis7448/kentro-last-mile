<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <title>HU_03 - Webhooks Shopify por tienda con frase del filtro y descartados de la semana (admin, escritorio)</title>
  <defs>
    <radialGradient id="ga" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#c6f24e" stop-opacity="0.12"/><stop offset="1" stop-color="#c6f24e" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7cc4ff" stop-opacity="0.10"/><stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="gc" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff8b7c" stop-opacity="0.08"/><stop offset="1" stop-color="#ff8b7c" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    text{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
    .n{font-variant-numeric:tabular-nums}
  </style>
  <rect width="1280" height="800" fill="#0e1116"/>
  <circle cx="220" cy="120" r="320" fill="url(#ga)"/>
  <circle cx="1180" cy="200" r="360" fill="url(#gb)"/>
  <circle cx="820" cy="520" r="300" fill="url(#gc)"/>

  <!-- Riel (admin) -->
  <rect x="0" y="0" width="84" height="800" fill="#191e25"/>
  <line x1="84" y1="0" x2="84" y2="800" stroke="#ffffff" stroke-opacity="0.06"/>
  <circle cx="42" cy="40" r="18" fill="#c6f24e"/>
  <text x="42" y="46" text-anchor="middle" font-size="16" font-weight="800" fill="#10140c">K</text>
  <g font-size="10" text-anchor="middle">
    <rect x="31" y="100" width="22" height="22" rx="7" fill="#9aa5b3" fill-opacity="0.5"/><text x="42" y="140" fill="#9aa5b3">Operacion</text>
    <rect x="31" y="166" width="22" height="22" rx="7" fill="#9aa5b3" fill-opacity="0.5"/><text x="42" y="206" fill="#9aa5b3">Wallet</text>
    <rect x="31" y="232" width="22" height="22" rx="7" fill="#9aa5b3" fill-opacity="0.5"/><text x="42" y="272" fill="#9aa5b3">Inventario</text>
    <rect x="12" y="290" width="60" height="58" rx="18" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="31" y="298" width="22" height="22" rx="7" fill="#c6f24e"/><text x="42" y="338" fill="#f4f6f8" font-weight="700">Tiendas</text>
    <rect x="31" y="364" width="22" height="22" rx="7" fill="#9aa5b3" fill-opacity="0.5"/><text x="42" y="404" fill="#9aa5b3">Cortes</text>
    <rect x="31" y="430" width="22" height="22" rx="7" fill="#9aa5b3" fill-opacity="0.5"/><text x="42" y="470" fill="#9aa5b3">Ajustes</text>
  </g>

  <text x="116" y="62" font-size="34" font-weight="800" fill="#f4f6f8" letter-spacing="-1.2">Integraciones</text>
  <text x="116" y="88" font-size="14" fill="#9aa5b3">Shopify, webhooks, UChat, claves de API e incidencias</text>

  <!-- Panel plegado de contexto -->
  <rect x="116" y="110" width="1132" height="56" rx="24" fill="#191e25" stroke="#ffffff" stroke-opacity="0.06"/>
  <path d="M134 133 l5 5 l-5 5" fill="none" stroke="#9aa5b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="154" y="134" font-size="14" font-weight="700" fill="#f4f6f8">Tiendas Shopify</text>
  <text x="154" y="152" font-size="12" fill="#9aa5b3">12 conectadas</text>

  <!-- Webhooks Shopify por tienda -->
  <rect x="116" y="178" width="1132" height="560" rx="24" fill="#191e25" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="148" y="214" font-size="18" font-weight="700" fill="#f4f6f8">Webhooks Shopify por tienda</text>
  <text x="148" y="236" font-size="13" fill="#9aa5b3">3 tiendas con webhook <tspan fill="#ff8b7c" font-weight="600">· 1 con pedidos descartados esta semana</tspan></text>
  <text x="148" y="266" font-size="13" fill="#9aa5b3">La frase es el filtro que el sistema aplica de verdad. Descartados: pedidos de Cali que el filtro de productos dejo fuera en 7 dias.</text>

  <!-- Tabla -->
  <g font-size="12" font-weight="600" fill="#9aa5b3">
    <text x="148" y="306">Tienda</text>
    <text x="420" y="306">Filtro de productos</text>
    <text x="780" y="306">Descartados 7 dias</text>
    <text x="940" y="306">URL del webhook</text>
  </g>
  <line x1="148" y1="318.5" x2="1216" y2="318.5" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Fila Infinito: acepta todo -->
  <text x="148" y="352" font-size="14" font-weight="700" fill="#f4f6f8">Infinito</text>
  <text x="148" y="372" font-size="12" fill="#9aa5b3">tienda-infinito.myshopify.com</text>
  <text x="148" y="390" class="n" font-size="12" fill="#9aa5b3">Ultimo webhook: 6 nov 2026, 09:12</text>
  <circle cx="428" cy="347" r="7" fill="none" stroke="#c6f24e" stroke-width="1.6"/>
  <path d="M424.5 347 l2.5 2.5 l4 -4.5" fill="none" stroke="#c6f24e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="442" y="352" font-size="13" font-weight="600" fill="#f4f6f8">Entran todos tus productos.</text>
  <text x="442" y="371" font-size="13" fill="#cbd3dc">Solo se descartan pedidos fuera de Cali.</text>
  <text x="780" y="352" class="n" font-size="13" fill="#9aa5b3">Ninguno</text>
  <rect x="940" y="330" width="160" height="44" rx="16" fill="#212832" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="952" y="357" font-size="12" fill="#cbd3dc">https://us-central1-ke...</text>
  <rect x="1108" y="330" width="108" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="1162" y="357" text-anchor="middle" font-size="13" font-weight="600" fill="#f4f6f8">Copiar URL</text>
  <line x1="148" y1="410.5" x2="1216" y2="410.5" stroke="#ffffff" stroke-opacity="0.05"/>

  <!-- Fila Nambu: filtro ADMA con descartados (resaltada) -->
  <rect x="136" y="416" width="1092" height="100" rx="16" fill="#ff8b7c" fill-opacity="0.05"/>
  <text x="148" y="448" font-size="14" font-weight="700" fill="#f4f6f8">Nambu</text>
  <text x="148" y="468" font-size="12" fill="#9aa5b3">nambu-co.myshopify.com</text>
  <text x="148" y="486" class="n" font-size="12" fill="#9aa5b3">Ultimo webhook: 6 nov 2026, 08:47</text>
  <path d="M421 441 h14 l-5 6 v6 l-4 2 v-8 z" fill="none" stroke="#7cc4ff" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="442" y="448" font-size="13" fill="#f4f6f8">Solo entran pedidos con un producto cuyo SKU</text>
  <text x="442" y="467" font-size="13" fill="#f4f6f8">contenga ADMA o con la etiqueta ADMA.</text>
  <text x="442" y="486" font-size="13" fill="#f4f6f8">Los demas se descartan.</text>
  <rect x="772" y="430" width="156" height="50" rx="14" fill="#ff8b7c" fill-opacity="0.10" stroke="#ff8b7c" stroke-opacity="0.5"/>
  <text x="784" y="451" class="n" font-size="14" font-weight="800" fill="#ff8b7c">153 descartados</text>
  <text x="784" y="469" font-size="12" font-weight="600" fill="#ff8b7c">esta semana</text>
  <rect x="940" y="434" width="160" height="44" rx="16" fill="#212832" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="952" y="461" font-size="12" fill="#cbd3dc">https://us-central1-ke...</text>
  <rect x="1108" y="434" width="108" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="1162" y="461" text-anchor="middle" font-size="13" font-weight="600" fill="#f4f6f8">Copiar URL</text>
  <line x1="148" y1="522.5" x2="1216" y2="522.5" stroke="#ffffff" stroke-opacity="0.05"/>

  <!-- Fila Kovia: sin filtro guardado, se muestra lo que aplica (ADMA) -->
  <text x="148" y="556" font-size="14" font-weight="700" fill="#f4f6f8">Kovia</text>
  <text x="148" y="576" font-size="12" fill="#9aa5b3">kovia-col.myshopify.com</text>
  <text x="148" y="594" class="n" font-size="12" fill="#9aa5b3">Ultimo webhook: 5 nov 2026, 18:03</text>
  <path d="M421 549 h14 l-5 6 v6 l-4 2 v-8 z" fill="none" stroke="#7cc4ff" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="442" y="556" font-size="13" fill="#f4f6f8">Solo entran pedidos con un producto cuyo SKU</text>
  <text x="442" y="575" font-size="13" fill="#f4f6f8">contenga ADMA o con la etiqueta ADMA.</text>
  <text x="442" y="594" font-size="13" fill="#f4f6f8">Los demas se descartan.</text>
  <text x="442" y="614" font-size="12" fill="#9aa5b3">Sin filtro guardado: aplica ADMA, el valor antiguo.</text>
  <text x="780" y="556" class="n" font-size="13" fill="#9aa5b3">Ninguno</text>
  <rect x="940" y="538" width="160" height="44" rx="16" fill="#212832" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="952" y="565" font-size="12" fill="#cbd3dc">https://us-central1-ke...</text>
  <rect x="1108" y="538" width="108" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="1162" y="565" text-anchor="middle" font-size="13" font-weight="600" fill="#f4f6f8">Copiar URL</text>
  <line x1="148" y1="632.5" x2="1216" y2="632.5" stroke="#ffffff" stroke-opacity="0.05"/>

  <text x="148" y="664" font-size="12" fill="#9aa5b3">Configurar la URL en Shopify en Order creation y Order update.</text>
  <text x="148" y="682" font-size="12" fill="#9aa5b3">Para traer un pedido viejo: si la tienda filtra por etiqueta, agregar la etiqueta y guardar; si acepta todo, basta con guardarlo en Shopify.</text>
  <text x="148" y="712" class="n" font-size="12" fill="#9aa5b3">Mostrando 1-3 de 3</text>
</svg>

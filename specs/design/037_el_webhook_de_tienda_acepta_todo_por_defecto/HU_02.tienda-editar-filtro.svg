<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <title>HU_02 - Cambiar el filtro de productos con vista previa de la frase (tienda, movil)</title>
  <defs>
    <radialGradient id="ga" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#c6f24e" stop-opacity="0.12"/><stop offset="1" stop-color="#c6f24e" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7cc4ff" stop-opacity="0.10"/><stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    text{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
    .n{font-variant-numeric:tabular-nums}
  </style>
  <rect width="375" height="812" fill="#0e1116"/>
  <circle cx="60" cy="160" r="200" fill="url(#ga)"/>
  <circle cx="340" cy="560" r="220" fill="url(#gb)"/>

  <!-- Cabecera -->
  <rect x="0" y="0" width="375" height="56" fill="#0e1116" fill-opacity="0.92"/>
  <circle cx="32" cy="28" r="15" fill="#c6f24e"/>
  <text x="32" y="33" text-anchor="middle" font-size="14" font-weight="800" fill="#10140c">K</text>
  <text x="56" y="34" font-size="17" font-weight="800" fill="#f4f6f8">Kentro</text>
  <circle cx="343" cy="28" r="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="343" y="32" text-anchor="middle" font-size="12" font-weight="700" fill="#f4f6f8">NB</text>

  <text x="16" y="94" font-size="26" font-weight="800" fill="#f4f6f8" letter-spacing="-0.9">Integraciones</text>

  <rect x="16" y="112" width="343" height="600" rx="24" fill="#191e25" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="32" y="144" font-size="16" font-weight="700" fill="#f4f6f8">Conexion Shopify</text>

  <rect x="28" y="158" width="319" height="542" rx="16" fill="#212832"/>
  <text x="44" y="186" font-size="15" font-weight="700" fill="#f4f6f8">Webhook de sincronizacion</text>
  <text x="44" y="206" font-size="12" fill="#9aa5b3">Elige que pedidos de Cali entran a Kentro.</text>

  <!-- radiogroup "Filtro de productos" -->
  <text x="44" y="238" font-size="13" font-weight="700" fill="#f4f6f8">Filtro de productos</text>

  <rect x="44" y="250" width="287" height="48" rx="16" fill="#191e25" stroke="#ffffff" stroke-opacity="0.10"/>
  <circle cx="66" cy="274" r="9" fill="none" stroke="#9aa5b3" stroke-width="1.8"/>
  <text x="86" y="279" font-size="14" font-weight="600" fill="#f4f6f8">Todos mis productos</text>

  <rect x="44" y="306" width="287" height="48" rx="16" fill="#191e25" stroke="#c6f24e" stroke-opacity="0.6"/>
  <circle cx="66" cy="330" r="9" fill="none" stroke="#c6f24e" stroke-width="1.8"/>
  <circle cx="66" cy="330" r="4.5" fill="#c6f24e"/>
  <text x="84" y="335" font-size="13" font-weight="600" fill="#f4f6f8">Solo productos cuyo SKU contenga...</text>

  <!-- textbox "SKU contiene" (visible solo con la segunda opcion) -->
  <text x="44" y="382" font-size="12" font-weight="600" fill="#9aa5b3">SKU contiene</text>
  <rect x="44" y="390" width="287" height="44" rx="16" fill="#191e25" stroke="#c6f24e" stroke-opacity="0.45"/>
  <text x="58" y="417" font-size="14" font-weight="600" fill="#f4f6f8">ADMA</text>
  <line x1="101" y1="403" x2="101" y2="421" stroke="#c6f24e" stroke-width="1.5"/>
  <text x="44" y="454" font-size="12" fill="#9aa5b3">Tambien entran pedidos con esa etiqueta.</text>
  <text x="44" y="470" font-size="12" fill="#9aa5b3">Si lo dejas vacio, entran todos tus productos.</text>

  <!-- Vista previa de la frase (role=status, aria-live) -->
  <rect x="44" y="486" width="287" height="110" rx="16" fill="#7cc4ff" fill-opacity="0.06" stroke="#7cc4ff" stroke-opacity="0.35"/>
  <text x="58" y="510" font-size="12" font-weight="600" fill="#7cc4ff">Asi quedara</text>
  <text x="58" y="534" font-size="13" fill="#f4f6f8">Solo entran pedidos con un producto</text>
  <text x="58" y="553" font-size="13" fill="#f4f6f8">cuyo SKU contenga ADMA o con la</text>
  <text x="58" y="572" font-size="13" fill="#f4f6f8">etiqueta ADMA. Los demas se descartan.</text>

  <!-- Acciones -->
  <rect x="44" y="612" width="150" height="44" rx="22" fill="#c6f24e"/>
  <text x="119" y="639" text-anchor="middle" font-size="14" font-weight="700" fill="#10140c">Guardar filtro</text>
  <rect x="202" y="612" width="110" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="257" y="639" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f6f8">Cancelar</text>
  <text x="44" y="682" font-size="12" fill="#9aa5b3">La URL del webhook no cambia al guardar.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <title>HU_01 - Dialogo Plazo y aviso (admin, movil)</title>
  <style>
    text{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
    .n{font-variant-numeric:tabular-nums}
  </style>
  <!-- Pantalla de fondo atenuada (la pestana Efectivo sin llegar) -->
  <rect width="375" height="812" fill="#0e1116"/>
  <text x="16" y="96" font-size="28" font-weight="800" fill="#f4f6f8" letter-spacing="-0.9">Liquidaciones</text>
  <rect x="16" y="112" width="343" height="52" rx="26" fill="#ffffff" fill-opacity="0.06"/>
  <text x="16" y="198" font-size="20" font-weight="700" fill="#f4f6f8">Efectivo sin llegar</text>
  <rect x="16" y="230" width="343" height="132" rx="24" fill="#191e25"/>
  <rect width="375" height="812" fill="#000000" fill-opacity="0.62"/>

  <!-- Hoja inferior (dialog "Plazo y aviso") -->
  <rect x="0" y="292" width="375" height="540" rx="24" fill="#191e25"/>
  <rect x="163" y="302" width="48" height="5" rx="2.5" fill="#9aa5b3" fill-opacity="0.5"/>
  <text x="24" y="348" font-size="20" font-weight="700" fill="#f4f6f8">Plazo y aviso</text>
  <circle cx="331" cy="342" r="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
  <path d="M324 335 l14 14 M338 335 l-14 14" stroke="#f4f6f8" stroke-width="2" stroke-linecap="round"/>

  <text x="24" y="390" font-size="13" font-weight="600" fill="#cbd3dc">Plazo en dias</text>
  <rect x="24" y="400" width="327" height="44" rx="22" fill="#212832" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="44" y="427" class="n" font-size="15" font-weight="600" fill="#f4f6f8">7</text>
  <text x="24" y="464" font-size="12" fill="#9aa5b3">Una contraentrega vence si pasa este numero de</text>
  <text x="24" y="480" font-size="12" fill="#9aa5b3">dias sin llegar a un corte. Entre 1 y 120.</text>

  <text x="24" y="518" font-size="13" font-weight="600" fill="#cbd3dc">Avisar desde, en pesos</text>
  <rect x="24" y="528" width="327" height="44" rx="22" fill="#212832" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="44" y="555" class="n" font-size="15" font-weight="600" fill="#f4f6f8">20.000</text>
  <text x="24" y="592" font-size="12" fill="#9aa5b3">Los montos menores se ven en la lista, pero no</text>
  <text x="24" y="608" font-size="12" fill="#9aa5b3">generan aviso.</text>

  <rect x="24" y="626" width="327" height="64" rx="16" fill="#212832"/>
  <circle cx="44" cy="646" r="6" fill="#c6f24e"/>
  <text x="58" y="650" font-size="12" font-weight="600" fill="#f4f6f8">Canal de aviso configurado</text>
  <text x="40" y="672" font-size="12" fill="#9aa5b3">Sale cada dia a las 8:00, una vez por pedido.</text>

  <rect x="24" y="712" width="150" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="99" y="739" text-anchor="middle" font-size="15" font-weight="600" fill="#f4f6f8">Cancelar</text>
  <rect x="186" y="712" width="165" height="44" rx="22" fill="#c6f24e"/>
  <text x="268.5" y="739" text-anchor="middle" font-size="15" font-weight="700" fill="#10140c">Guardar</text>
</svg>

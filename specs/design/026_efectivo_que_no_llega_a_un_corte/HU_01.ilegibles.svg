<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <title>HU_01 - Efectivo sin llegar con documentos ilegibles (admin, movil)</title>
  <defs>
    <radialGradient id="ga" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#c6f24e" stop-opacity="0.14"/><stop offset="1" stop-color="#c6f24e" stop-opacity="0"/></radialGradient>
    <radialGradient id="gc" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff8b7c" stop-opacity="0.12"/><stop offset="1" stop-color="#ff8b7c" stop-opacity="0"/></radialGradient>
    <clipPath id="tabsclip"><rect x="0" y="108" width="375" height="60"/></clipPath>
  </defs>
  <style>
    text{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
    .n{font-variant-numeric:tabular-nums}
  </style>
  <rect width="375" height="812" fill="#0e1116"/>
  <circle cx="30" cy="160" r="190" fill="url(#ga)"/>
  <circle cx="340" cy="420" r="200" fill="url(#gc)"/>

  <rect x="0" y="0" width="375" height="56" fill="#0e1116" fill-opacity="0.92"/>
  <circle cx="32" cy="28" r="15" fill="#c6f24e"/>
  <text x="32" y="33" text-anchor="middle" font-size="14" font-weight="800" fill="#10140c">K</text>
  <text x="56" y="34" font-size="17" font-weight="800" fill="#f4f6f8">Kentro</text>
  <circle cx="343" cy="28" r="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="343" y="32" text-anchor="middle" font-size="12" font-weight="700" fill="#f4f6f8">AD</text>
  <text x="16" y="96" font-size="28" font-weight="800" fill="#f4f6f8" letter-spacing="-0.9">Liquidaciones</text>
  <g clip-path="url(#tabsclip)">
    <rect x="12" y="112" width="440" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="64" y="143" text-anchor="middle" font-size="14" font-weight="600" fill="#cbd3dc">Por pagar</text>
    <rect x="116" y="116" width="164" height="44" rx="22" fill="#f4f6f8"/>
    <text x="198" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#0e1116">Efectivo sin llegar</text>
    <text x="294" y="143" font-size="14" font-weight="600" fill="#cbd3dc">Cortes cerrados</text>
  </g>
  <text x="16" y="198" font-size="20" font-weight="700" fill="#f4f6f8">Efectivo sin llegar</text>
  <text x="16" y="220" font-size="13" fill="#9aa5b3">Contraentregas entregadas que Kentro aun no</text>
  <text x="16" y="238" font-size="13" fill="#9aa5b3">recibe en un corte · calculado hoy 10:42</text>
  <rect x="16" y="252" width="122" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="77" y="279" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f6f8">Actualizar</text>
  <rect x="146" y="252" width="132" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="212" y="279" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f6f8">Plazo y aviso</text>

  <!-- Region "Documentos ilegibles" -->
  <rect x="16" y="312" width="343" height="198" rx="24" fill="#191e25" stroke="#ff8b7c" stroke-opacity="0.35"/>
  <circle cx="48" cy="344" r="18" fill="#ff8b7c" fill-opacity="0.14"/>
  <text x="48" y="350" text-anchor="middle" font-size="17" font-weight="800" fill="#ff8b7c">!</text>
  <text x="76" y="350" font-size="16" font-weight="700" fill="#f4f6f8">Cifras incompletas</text>
  <text x="32" y="384" font-size="13" fill="#cbd3dc">3 documentos no se pudieron leer y no</text>
  <text x="32" y="402" font-size="13" fill="#cbd3dc">entran en el total: 2 pedidos y 1 corte.</text>
  <text x="32" y="426" font-size="13" fill="#9aa5b3">Un corte ilegible puede dejar aqui pedidos</text>
  <text x="32" y="444" font-size="13" fill="#9aa5b3">que en realidad ya estan cubiertos.</text>
  <rect x="32" y="454" width="226" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="145" y="481" text-anchor="middle" font-size="13" font-weight="600" fill="#f4f6f8">Ver documentos ilegibles</text>

  <!-- Franja de cifras (sin los cubiertos por compensacion ni los 2 pedidos ilegibles) -->
  <rect x="16" y="524" width="343" height="132" rx="24" fill="#191e25" stroke="#ffffff" stroke-opacity="0.06"/>
  <line x1="187.5" y1="540" x2="187.5" y2="604" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="32" y="550" font-size="12" fill="#9aa5b3">Sin llegar</text>
  <text x="32" y="578" class="n" font-size="21" font-weight="800" fill="#f4f6f8" letter-spacing="-0.5">$11.039.381</text>
  <text x="32" y="598" font-size="12" fill="#9aa5b3">115 pedidos</text>
  <text x="203" y="550" font-size="12" fill="#9aa5b3">Vencido, mas de 7 dias</text>
  <text x="203" y="578" class="n" font-size="21" font-weight="800" fill="#ff8b7c" letter-spacing="-0.5">$707.471</text>
  <text x="203" y="598" font-size="12" fill="#9aa5b3">10 pedidos</text>
  <line x1="32" y1="616" x2="343" y2="616" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="32" y="640" font-size="12" fill="#cbd3dc">83 fuera de todo corte · 32 en un corte sin cubrir</text>

  <text x="16" y="684" font-size="12" font-weight="600" fill="#cbd3dc">Lider</text>
  <rect x="16" y="692" width="343" height="44" rx="22" fill="#212832" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="36" y="719" font-size="14" fill="#f4f6f8">Todos los lideres</text>
  <path d="M331 710 l6 6 l6 -6" fill="none" stroke="#cbd3dc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="0" y="748" width="375" height="64" fill="#141920"/>
  <line x1="0" y1="748.5" x2="375" y2="748.5" stroke="#ffffff" stroke-opacity="0.06"/>
  <g font-size="10" text-anchor="middle">
    <rect x="21" y="758" width="20" height="20" rx="6" fill="#9aa5b3" fill-opacity="0.5"/><text x="31" y="796" fill="#9aa5b3">Operacion</text>
    <rect x="84" y="758" width="20" height="20" rx="6" fill="#9aa5b3" fill-opacity="0.5"/><text x="94" y="796" fill="#9aa5b3">Wallet</text>
    <rect x="146" y="758" width="20" height="20" rx="6" fill="#9aa5b3" fill-opacity="0.5"/><text x="156" y="796" fill="#9aa5b3">Inventario</text>
    <rect x="209" y="758" width="20" height="20" rx="6" fill="#9aa5b3" fill-opacity="0.5"/><text x="219" y="796" fill="#9aa5b3">Tiendas</text>
    <rect x="271" y="758" width="20" height="20" rx="6" fill="#c6f24e"/><text x="281" y="796" fill="#f4f6f8" font-weight="700">Cortes</text>
    <rect x="334" y="758" width="20" height="20" rx="6" fill="#9aa5b3" fill-opacity="0.5"/><text x="344" y="796" fill="#9aa5b3">Ajustes</text>
  </g>
</svg>

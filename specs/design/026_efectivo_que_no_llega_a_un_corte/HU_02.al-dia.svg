<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <title>HU_02 - Efectivo sin llegar a Kentro, al dia (lider logistico, movil)</title>
  <defs>
    <radialGradient id="ga" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#c6f24e" stop-opacity="0.14"/><stop offset="1" stop-color="#c6f24e" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    text{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
  </style>
  <rect width="375" height="812" fill="#0e1116"/>

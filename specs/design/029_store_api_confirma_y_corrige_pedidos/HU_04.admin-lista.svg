  <text x="148" y="334" font-size="13" fill="#9aa5b3">La clave de escritura confirma, corrige y cancela pedidos sin lider. Se muestra completa una sola vez: Kentro guarda solo su huella.</text>
  <text x="148" y="352" font-size="13" fill="#9aa5b3">Generarla o rotarla no toca la clave de lectura, y queda registrado quien lo hizo.</text>


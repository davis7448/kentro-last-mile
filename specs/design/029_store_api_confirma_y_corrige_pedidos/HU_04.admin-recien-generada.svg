<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <title>HU_04 - Clave de escritura generada por el admin para una tienda, mostrada una vez (admin, escritorio)</title>
  <defs>
    <radialGradient id="ga" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#c6f24e" stop-opacity="0.12"/><stop offset="1" stop-color="#c6f24e" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7cc4ff" stop-opacity="0.10"/><stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    text{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
    .n{font-variant-numeric:tabular-nums}
  </style>
  <rect width="1280" height="800" fill="#0e1116"/>
  <circle cx="220" cy="120" r="320" fill="url(#ga)"/>
  <circle cx="1180" cy="200" r="360" fill="url(#gb)"/>

  <!-- Fondo: HU_04.admin-lista, atenuado -->
  <rect x="0" y="0" width="84" height="800" fill="#191e25"/>
  <circle cx="42" cy="40" r="18" fill="#c6f24e"/>
  <text x="116" y="62" font-size="34" font-weight="800" fill="#f4f6f8" letter-spacing="-1.2">Integraciones</text>
  <rect x="116" y="110" width="1132" height="56" rx="24" fill="#191e25"/>
  <rect x="116" y="176" width="1132" height="56" rx="24" fill="#191e25"/>
  <rect x="116" y="244" width="1132" height="540" rx="24" fill="#191e25"/>
  <text x="154" y="272" font-size="14" font-weight="700" fill="#f4f6f8">Claves de API de tiendas</text>
  <g font-size="14" font-weight="700" fill="#f4f6f8">
    <text x="148" y="436">Kovia</text><text x="148" y="492">ONEP</text><text x="148" y="548">DANDA</text><text x="148" y="604">Bella Mujer</text><text x="148" y="660">Senziacol</text>
  </g>
  <rect x="0" y="0" width="1280" height="800" fill="#0e1116" fill-opacity="0.74"/>

  <!-- Dialogo (role=dialog, aria-modal) -->
  <rect x="400" y="150" width="480" height="440" rx="24" fill="#191e25" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="428" y="196" font-size="20" font-weight="800" fill="#f4f6f8" letter-spacing="-0.4">Clave de escritura de Bella Mujer</text>
  <circle cx="846" cy="190" r="22" fill="#ffffff" fill-opacity="0.06"/>
  <path d="M840 184 l12 12 M852 184 l-12 12" stroke="#cbd3dc" stroke-width="2" stroke-linecap="round"/>

  <rect x="428" y="220" width="424" height="290" rx="16" fill="#c6f24e" fill-opacity="0.08" stroke="#c6f24e" stroke-opacity="0.5"/>
  <circle cx="454" cy="248" r="12" fill="#c6f24e" fill-opacity="0.18"/>
  <text x="454" y="253" text-anchor="middle" font-size="14" font-weight="800" fill="#c6f24e">!</text>
  <text x="474" y="253" font-size="15" font-weight="700" fill="#f4f6f8">Copiala ahora</text>
  <text x="444" y="280" font-size="13" fill="#cbd3dc">Es la unica vez que se muestra completa: Kentro guarda</text>
  <text x="444" y="298" font-size="13" fill="#cbd3dc">solo su huella. Entregala a la tienda por un canal seguro.</text>

  <text x="444" y="328" font-size="12" font-weight="600" fill="#9aa5b3">Clave de escritura</text>
  <rect x="444" y="336" width="392" height="64" rx="16" fill="#212832" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="460" y="363" class="n" font-size="14" font-weight="600" fill="#f4f6f8" letter-spacing="0.4">a07e52c9d1f8436b0e2c97a4</text>
  <text x="460" y="385" class="n" font-size="14" font-weight="600" fill="#f4f6f8" letter-spacing="0.4">5d18b3f60c29e7a14b8d2f6a</text>

  <rect x="444" y="416" width="230" height="44" rx="22" fill="#c6f24e"/>
  <text x="559" y="443" text-anchor="middle" font-size="14" font-weight="700" fill="#10140c">Copiar clave de escritura</text>
  <rect x="686" y="416" width="150" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="761" y="443" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f6f8">Ya la guarde</text>
  <text x="444" y="488" font-size="12" fill="#9aa5b3">Si cierras sin copiarla, tendras que rotarla.</text>

  <text x="428" y="540" font-size="13" fill="#9aa5b3">Queda registrado que la generaste tu (Laura Gomez), hoy a las 11:08.</text>
  <text x="428" y="560" font-size="13" fill="#9aa5b3">La clave de lectura de Bella Mujer no cambia.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="375" height="960" viewBox="0 0 375 960">
  <title>HU_04 - Clave de escritura recien generada, se muestra una sola vez (tienda, movil)</title>
  <defs>
    <radialGradient id="ga" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#c6f24e" stop-opacity="0.12"/><stop offset="1" stop-color="#c6f24e" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7cc4ff" stop-opacity="0.10"/><stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    text{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
    .n{font-variant-numeric:tabular-nums}
  </style>
  <rect width="375" height="960" fill="#0e1116"/>
  <circle cx="60" cy="160" r="200" fill="url(#ga)"/>
  <circle cx="340" cy="640" r="240" fill="url(#gb)"/>

  <rect x="0" y="0" width="375" height="56" fill="#0e1116" fill-opacity="0.92"/>
  <circle cx="32" cy="28" r="15" fill="#c6f24e"/>
  <text x="32" y="33" text-anchor="middle" font-size="14" font-weight="800" fill="#10140c">K</text>
  <text x="56" y="34" font-size="17" font-weight="800" fill="#f4f6f8">Kentro</text>
  <circle cx="343" cy="28" r="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="343" y="32" text-anchor="middle" font-size="12" font-weight="700" fill="#f4f6f8">KV</text>

  <text x="16" y="98" font-size="28" font-weight="800" fill="#f4f6f8" letter-spacing="-0.9">Integraciones</text>
  <text x="16" y="122" font-size="14" fill="#9aa5b3">Shopify, API y sincronizacion</text>

  <rect x="16" y="142" width="343" height="64" rx="24" fill="#191e25" stroke="#ffffff" stroke-opacity="0.06"/>
  <path d="M33 168 l5 5 l-5 5" fill="none" stroke="#9aa5b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="52" y="170" font-size="14" font-weight="700" fill="#f4f6f8">Conexion con Shopify</text>
  <text x="52" y="188" font-size="12" fill="#c6f24e">1 tienda conectada</text>
  <circle cx="331" cy="174" r="11" fill="none" stroke="#9aa5b3" stroke-width="1.5"/>
  <text x="331" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#9aa5b3">?</text>

  <rect x="16" y="218" width="343" height="628" rx="24" fill="#191e25" stroke="#ffffff" stroke-opacity="0.06"/>
  <path d="M31 246 l5 5 l5 -5" fill="none" stroke="#9aa5b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="52" y="246" font-size="14" font-weight="700" fill="#f4f6f8">Clave de API</text>
  <text x="52" y="264" font-size="12" fill="#9aa5b3">Lectura y escritura desde tus sistemas</text>
  <circle cx="331" cy="250" r="11" fill="none" stroke="#9aa5b3" stroke-width="1.5"/>
  <text x="331" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#9aa5b3">?</text>
  <line x1="32" y1="284.5" x2="343" y2="284.5" stroke="#ffffff" stroke-opacity="0.06"/>

  <text x="32" y="312" font-size="15" font-weight="700" fill="#f4f6f8">Clave de lectura</text>
  <text x="32" y="334" font-size="13" fill="#9aa5b3">Consulta pedidos, KPIs y liquidaciones.</text>
  <rect x="32" y="350" width="311" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="187.5" y="377" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f6f8">Ver clave de lectura</text>
  <line x1="32" y1="414.5" x2="343" y2="414.5" stroke="#ffffff" stroke-opacity="0.06"/>

  <text x="32" y="442" font-size="15" font-weight="700" fill="#f4f6f8">Clave de escritura</text>

  <!-- Aviso: la clave se ve completa una sola vez (role=alert) -->
  <rect x="32" y="458" width="311" height="338" rx="16" fill="#c6f24e" fill-opacity="0.08" stroke="#c6f24e" stroke-opacity="0.5"/>
  <circle cx="58" cy="486" r="12" fill="#c6f24e" fill-opacity="0.18"/>
  <text x="58" y="491" text-anchor="middle" font-size="14" font-weight="800" fill="#c6f24e">!</text>
  <text x="78" y="491" font-size="15" font-weight="700" fill="#f4f6f8">Copiala ahora</text>
  <text x="48" y="518" font-size="13" fill="#cbd3dc">Solo se muestra completa esta vez:</text>
  <text x="48" y="536" font-size="13" fill="#cbd3dc">Kentro guarda su huella, no la clave.</text>

  <text x="48" y="562" font-size="12" font-weight="600" fill="#9aa5b3">Clave de escritura</text>
  <rect x="48" y="570" width="279" height="64" rx="16" fill="#212832" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="64" y="597" class="n" font-size="14" font-weight="600" fill="#f4f6f8" letter-spacing="0.4">9f3c1a7e4b20d58c6e91a0f2</text>
  <text x="64" y="619" class="n" font-size="14" font-weight="600" fill="#f4f6f8" letter-spacing="0.4">7b4d3e18c5a6902f7d4bc41e</text>

  <rect x="48" y="650" width="279" height="44" rx="22" fill="#c6f24e"/>
  <text x="187.5" y="677" text-anchor="middle" font-size="14" font-weight="700" fill="#10140c">Copiar clave de escritura</text>
  <rect x="48" y="706" width="279" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="187.5" y="733" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f6f8">Ya la guarde</text>
  <text x="48" y="772" font-size="12" fill="#9aa5b3">Si sales sin copiarla, tendras que</text>
  <text x="48" y="788" font-size="12" fill="#9aa5b3">generar otra.</text>

  <text x="32" y="822" font-size="12" fill="#9aa5b3">Va solo en la cabecera Authorization: Bearer.</text>

  <rect x="0" y="896" width="375" height="64" fill="#191e25"/>
  <line x1="0" y1="896.5" x2="375" y2="896.5" stroke="#ffffff" stroke-opacity="0.06"/>
  <g font-size="11" text-anchor="middle">
    <rect x="37" y="906" width="20" height="20" rx="6" fill="#9aa5b3" fill-opacity="0.5"/><text x="47" y="944" fill="#9aa5b3">Operacion</text>
    <rect x="131" y="906" width="20" height="20" rx="6" fill="#9aa5b3" fill-opacity="0.5"/><text x="141" y="944" fill="#9aa5b3">Wallet</text>
    <rect x="224" y="906" width="20" height="20" rx="6" fill="#9aa5b3" fill-opacity="0.5"/><text x="234" y="944" fill="#9aa5b3">Inventario</text>
    <rect x="318" y="906" width="20" height="20" rx="6" fill="#c6f24e"/><text x="328" y="944" fill="#f4f6f8" font-weight="700">Tiendas</text>
  </g>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-label="Dialogo Corregir costo de producto, fase 2: vista previa por tienda, proveedor y pedido antes de aplicar">

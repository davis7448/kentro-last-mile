<g>
<rect x="116" y="196" width="104" height="40" rx="20" class="ol"/><text x="168" y="221" class="c s sb m">Por pagar</text>
<rect x="228" y="196" width="148" height="40" rx="20" class="ol"/><text x="302" y="221" class="c s sb m">Cortes cerrados</text>

<rect x="116" y="316" width="1132" height="300" rx="24" fill="#191e25" stroke="#ffffff" stroke-opacity=".06" filter="url(#sh)"/>
<text x="140" y="350" class="h2">Productos a $0 con pedidos entregados</text>
<rect x="490" y="334" width="30" height="22" rx="11" fill="#ff8b7c" fill-opacity=".14"/><text x="505" y="350" class="c xs b rust">3</text>
<text x="140" y="374" class="xs m">Fichas activas de Nambu sin costo que ya tienen pedidos cerrados. Su costo no se desconto al cerrar: revisalo antes de liquidar.</text>

<g class="xs m sb">
<text x="140" y="410">Producto</text>

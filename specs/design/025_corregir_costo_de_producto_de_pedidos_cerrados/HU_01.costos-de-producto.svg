<rect x="116" y="100" width="280" height="76" rx="24" fill="#c6f24e" fill-opacity=".86" stroke="#ffffff" stroke-opacity=".32"/>
<text x="136" y="128" class="xs deep sb">Total por pagar</text>
<text x="136" y="160" class="deep b num" font-size="26">$12.480.300</text>
<rect x="408" y="100" width="840" height="76" rx="24" fill="#191e25" stroke="#ffffff" stroke-opacity=".06"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-label="Liquidaciones, pestana Costo de producto: productos a 0 pesos con pedidos entregados de la tienda Nambu">
<title>HU_01 - Costo de producto (escritorio)</title>
<defs>
<radialGradient id="ga"><stop offset="0" stop-color="#c6f24e" stop-opacity=".16"/><stop offset="1" stop-color="#c6f24e" stop-opacity="0"/></radialGradient>
<radialGradient id="gb"><stop offset="0" stop-color="#7cc4ff" stop-opacity=".14"/><stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/></radialGradient>
<radialGradient id="gc"><stop offset="0" stop-color="#ff8b7c" stop-opacity=".12"/><stop offset="1" stop-color="#ff8b7c" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-5%" y="-10%" width="110%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter>
<style>
text{font-family:'Plus Jakarta Sans',Arial,sans-serif;fill:#f4f6f8;font-size:14px}
.t30{font-size:30px;font-weight:800;letter-spacing:-1px}
.h2{font-size:18px;font-weight:700}
.s{font-size:13px}.xs{font-size:12px}.xxs{font-size:11px}
.m{fill:#9aa5b3}.fg2{fill:#cbd3dc}.rust{fill:#ff8b7c}.info{fill:#7cc4ff}.deep{fill:#10140c}
.b{font-weight:700}.sb{font-weight:600}
.num{font-variant-numeric:tabular-nums}
.r{text-anchor:end}.c{text-anchor:middle}
.ln{stroke:#ffffff;stroke-opacity:.06;stroke-width:1}
.ol{fill:none;stroke:#ffffff;stroke-opacity:.14;stroke-width:1}
</style>
</defs>
<rect width="1280" height="800" fill="#0e1116"/>
<circle cx="1100" cy="120" r="320" fill="url(#ga)"/>
<circle cx="300" cy="700" r="360" fill="url(#gb)"/>
<circle cx="1180" cy="720" r="260" fill="url(#gc)"/>

<!-- Riel -->
<rect x="0" y="0" width="84" height="800" fill="#191e25"/>
<circle cx="42" cy="44" r="20" fill="#c6f24e"/><text x="42" y="50" class="c deep b" font-size="16">K</text>
<g>
<circle cx="42" cy="140" r="18" fill="#212832"/><rect x="35" y="133" width="14" height="14" rx="4" class="ol"/><text x="42" y="174" class="c xxs m">Operacion</text>
<circle cx="42" cy="210" r="18" fill="#212832"/><rect x="35" y="203" width="14" height="14" rx="4" class="ol"/><text x="42" y="244" class="c xxs m">Wallet</text>
<circle cx="42" cy="280" r="18" fill="#212832"/><rect x="35" y="273" width="14" height="14" rx="4" class="ol"/><text x="42" y="314" class="c xxs m">Inventario</text>
<circle cx="42" cy="350" r="18" fill="#212832"/><rect x="35" y="343" width="14" height="14" rx="4" class="ol"/><text x="42" y="384" class="c xxs m">Tiendas</text>
<circle cx="42" cy="420" r="18" fill="#c6f24e"/><rect x="35" y="413" width="14" height="14" rx="4" fill="none" stroke="#10140c"/><text x="42" y="454" class="c xxs b">Cortes</text>
<circle cx="42" cy="490" r="18" fill="#212832"/><rect x="35" y="483" width="14" height="14" rx="4" class="ol"/><text x="42" y="524" class="c xxs m">Ajustes</text>
</g>


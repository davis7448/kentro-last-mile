</g>
<rect x="16" y="524" width="150" height="44" rx="22" class="ol"/><text x="91" y="551" class="c s sb">Agregar pedido</text>
<text x="359" y="544" class="r s b num">+$36.000</text>
<text x="359" y="560" class="r xxs m">a favor de LuminXP</text>

<rect x="16" y="580" width="343" height="56" rx="16" fill="#ff8b7c" fill-opacity=".06" stroke="#ff8b7c" stroke-opacity=".25"/>

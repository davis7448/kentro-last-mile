<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" role="img" aria-label="Movil: formulario Registrar cruce, el proveedor ADMA LABORATORIO asume los envios de LuminXP por pedido">
<title>HU_02 - Registrar cruce (movil 375)</title>
<defs>
<style>
text{font-family:'Plus Jakarta Sans',Arial,sans-serif;fill:#f4f6f8;font-size:14px}
.h{font-size:18px;font-weight:700}
.s{font-size:13px}.xs{font-size:12px}.xxs{font-size:11px}
.m{fill:#9aa5b3}.fg2{fill:#cbd3dc}.rust{fill:#ff8b7c}.deep{fill:#10140c}
.b{font-weight:700}.sb{font-weight:600}
.num{font-variant-numeric:tabular-nums}
.r{text-anchor:end}.c{text-anchor:middle}
.ol{fill:none;stroke:#ffffff;stroke-opacity:.14;stroke-width:1}

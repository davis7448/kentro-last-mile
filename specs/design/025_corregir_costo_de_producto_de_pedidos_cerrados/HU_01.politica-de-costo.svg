<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" role="img" aria-label="Movil: dialogo Politica de costo de Lemme con las marcas 0 pesos a proposito y paga por fuera de Kentro">
<title>HU_01 - Politica de costo (movil 375)</title>
<defs>
<style>
text{font-family:'Plus Jakarta Sans',Arial,sans-serif;fill:#f4f6f8;font-size:14px}
.h{font-size:18px;font-weight:700}
.s{font-size:13px}.xs{font-size:12px}.xxs{font-size:11px}
.m{fill:#9aa5b3}.fg2{fill:#cbd3dc}.rust{fill:#ff8b7c}.deep{fill:#10140c}
.b{font-weight:700}.sb{font-weight:600}
.c{text-anchor:middle}
.ol{fill:none;stroke:#ffffff;stroke-opacity:.14;stroke-width:1}
</style>
</defs>
<rect width="375" height="812" fill="#0e1116"/>
<rect width="375" height="812" fill="#000000" fill-opacity=".4"/>

<rect x="12" y="40" width="351" height="732" rx="24" fill="#191e25" stroke="#ffffff" stroke-opacity=".06"/>
<text x="28" y="76" class="h">Politica de costo de Lemme</text>
<text x="28" y="98" class="xs m">Tienda LuminXP · proveedor ADMA LABORATORIO</text>
<text x="28" y="116" class="xs m">Costo en la ficha: $0</text>
<circle cx="331" cy="70" r="22" class="ol"/>
<path d="M324 63 l14 14 M338 63 l-14 14" stroke="#9aa5b3" stroke-width="2"/>

<!-- Opcion 1 -->
<rect x="28" y="136" width="319" height="96" rx="16" fill="#212832" stroke="#ffffff" stroke-opacity=".1"/>
<rect x="42" y="152" width="18" height="18" rx="5" fill="none" stroke="#9aa5b3" stroke-width="1.5"/>
<text x="72" y="166" class="sb">$0 a proposito</text>
<text x="72" y="188" class="xs m">Producto propio, de prueba o regalado.</text>
<text x="72" y="206" class="xs m">Sale de la lista de huecos. No cambia</text>
<text x="72" y="222" class="xs m">ningun importe.</text>

<!-- Opcion 2: marcada -->
<rect x="28" y="244" width="319" height="116" rx="16" fill="#c6f24e" fill-opacity=".05" stroke="#c6f24e" stroke-opacity=".4"/>
<rect x="42" y="260" width="18" height="18" rx="5" fill="#c6f24e"/>
<path d="M45 269 l4 4 l8 -9" fill="none" stroke="#10140c" stroke-width="2.2"/>
<text x="72" y="274" class="sb">La tienda le paga este producto</text>
<text x="72" y="292" class="sb">al proveedor por fuera de Kentro</text>
<text x="72" y="316" class="xs m">El cierre deja de descontar Lemme en</text>
<text x="72" y="334" class="xs m">cada pedido futuro de LuminXP.</text>

<!-- Aviso -->
<rect x="28" y="374" width="319" height="112" rx="16" fill="#ff8b7c" fill-opacity=".06" stroke="#ff8b7c" stroke-opacity=".25"/>
<text x="42" y="398" class="xs b rust">Cambia el dinero de cada cierre futuro</text>
<text x="42" y="420" class="xs fg2">Los pedidos ya cerrados no se tocan. 3 pedidos</text>
<text x="42" y="438" class="xs fg2">entregados de Lemme tienen costo cobrado</text>
<text x="42" y="456" class="xs fg2">($69.000): devuelvelos con Corregir costo</text>
<text x="42" y="474" class="xs fg2">despues de guardar.</text>

<!-- Motivo -->
<text x="28" y="512" class="xs sb m">Motivo (queda en la auditoria)</text>
<rect x="28" y="522" width="319" height="104" rx="16" fill="#212832" stroke="#ffffff" stroke-opacity=".1"/>
<text x="44" y="548" class="s">LuminXP le paga Lemme a ADMA LAB</text>
<text x="44" y="568" class="s">directamente (acuerdo confirmado el</text>
<text x="44" y="588" class="s">30 sep).</text>
<text x="44" y="612" class="xxs m">Minimo 10 caracteres</text>

<!-- Acciones -->
<line x1="12" y1="690" x2="363" y2="690" stroke="#ffffff" stroke-opacity=".06"/>
<rect x="28" y="708" width="120" height="44" rx="22" class="ol"/><text x="88" y="735" class="c s sb">Cancelar</text>
<rect x="156" y="708" width="191" height="44" rx="22" fill="#c6f24e"/><text x="251" y="735" class="c s b deep">Guardar politica</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-label="Liquidaciones, Costo de producto, tienda LuminXP: lista de correcciones aplicadas con la accion Revertir">
<title>HU_03 - Correcciones aplicadas (escritorio)</title>
<defs>
<filter id="sh" x="-5%" y="-10%" width="110%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter>
<style>
text{font-family:'Plus Jakarta Sans',Arial,sans-serif;fill:#f4f6f8;font-size:14px}
.t30{font-size:30px;font-weight:800;letter-spacing:-1px}
.h2{font-size:18px;font-weight:700}
.s{font-size:13px}.xs{font-size:12px}.xxs{font-size:11px}
.m{fill:#9aa5b3}.fg2{fill:#cbd3dc}.rust{fill:#ff8b7c}.mint{fill:#c6f24e}.deep{fill:#10140c}
.b{font-weight:700}.sb{font-weight:600}
.num{font-variant-numeric:tabular-nums}
.r{text-anchor:end}.c{text-anchor:middle}
.ln{stroke:#ffffff;stroke-opacity:.06;stroke-width:1}
.ol{fill:none;stroke:#ffffff;stroke-opacity:.14;stroke-width:1}
</style>
</defs>
<rect width="1280" height="800" fill="#0e1116"/>
<rect x="0" y="0" width="84" height="800" fill="#191e25"/>
<circle cx="42" cy="44" r="20" fill="#c6f24e"/><text x="42" y="50" class="c deep b" font-size="16">K</text>
<circle cx="42" cy="140" r="18" fill="#212832"/><text x="42" y="174" class="c xxs m">Operacion</text>
<circle cx="42" cy="210" r="18" fill="#212832"/><text x="42" y="244" class="c xxs m">Wallet</text>
<circle cx="42" cy="280" r="18" fill="#212832"/><text x="42" y="314" class="c xxs m">Inventario</text>
<circle cx="42" cy="350" r="18" fill="#212832"/><text x="42" y="384" class="c xxs m">Tiendas</text>
<circle cx="42" cy="420" r="18" fill="#c6f24e"/><text x="42" y="454" class="c xxs b">Cortes</text>
<circle cx="42" cy="490" r="18" fill="#212832"/><text x="42" y="524" class="c xxs m">Ajustes</text>

<text x="116" y="58" class="t30">Liquidaciones</text>
<!-- (cabecera compartida omitida: igual que en HU_01.costos-de-producto) -->
<rect x="116" y="84" width="104" height="40" rx="20" class="ol"/><text x="168" y="109" class="c s sb m">Por pagar</text>
<rect x="228" y="84" width="148" height="40" rx="20" class="ol"/><text x="302" y="109" class="c s sb m">Cortes cerrados</text>
<rect x="384" y="84" width="178" height="40" rx="20" class="ol"/><text x="473" y="109" class="c s sb m">Resumen del periodo</text>
<rect x="570" y="84" width="168" height="40" rx="20" fill="#c6f24e"/><text x="654" y="109" class="c s sb deep">Costo de producto</text>

<text x="116" y="160" class="xs sb m">Tienda</text>
<rect x="166" y="142" width="300" height="44" rx="22" fill="#191e25" stroke="#ffffff" stroke-opacity=".1"/>
<text x="188" y="169" class="s">LuminXP</text>
<path d="M444 160 l6 6 l6 -6" fill="none" stroke="#9aa5b3" stroke-width="2"/>
<rect x="976" y="142" width="140" height="44" rx="22" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/><text x="1046" y="169" class="c s sb">Registrar cruce</text>
<rect x="1128" y="142" width="120" height="44" rx="22" fill="#c6f24e"/><text x="1188" y="169" class="c s b deep">Corregir costo</text>

<!-- Huecos plegado (vacio en LuminXP) -->
<rect x="116" y="206" width="1132" height="56" rx="24" fill="#191e25" stroke="#ffffff" stroke-opacity=".06"/>
<path d="M142 228 l6 6 l-6 6" fill="none" stroke="#9aa5b3" stroke-width="2"/>
<text x="162" y="231" class="s b">Productos a $0 con pedidos entregados</text>
<text x="162" y="249" class="xs m">Ninguno. Lemme esta marcado como pagado por fuera de Kentro.</text>

<!-- Correcciones desplegado -->
<rect x="116" y="278" width="1132" height="470" rx="24" fill="#191e25" stroke="#ffffff" stroke-opacity=".06" filter="url(#sh)"/>
<path d="M140 300 l6 6 l6 -6" fill="none" stroke="#9aa5b3" stroke-width="2"/>
<text x="164" y="308" class="h2">Correcciones aplicadas</text>
<text x="164" y="330" class="xs m">Revertir deja a la tienda y al proveedor como antes. Lo que siga abierto se borra; lo que ya entro a un corte se compensa.</text>

<g class="xs sb m">
<text x="140" y="370">Fecha</text><text x="270" y="370">Tipo</text><text x="380" y="370">Productos o concepto</text>
<text x="690" y="370" class="r">Pedidos</text><text x="830" y="370" class="r">Tienda</text><text x="860" y="370">Por</text><text x="960" y="370">Estado</text>
</g>
<line x1="140" y1="382" x2="1224" y2="382" class="ln"/>

<g class="s num">
<text x="140" y="412">02 oct 10:20</text><text x="270" y="412">Cruce</text><text x="380" y="412">Envios que asume ADMA LAB</text>
<text x="690" y="412" class="r">3</text><text x="830" y="412" class="r b mint">+$36.000</text><text x="860" y="412" class="fg2">Davis</text>
<rect x="960" y="398" width="76" height="22" rx="11" fill="#212832"/><text x="998" y="413" class="c xs sb">Aplicada</text>
<rect x="1124" y="392" width="100" height="40" rx="20" class="ol"/><text x="1174" y="417" class="c s sb">Revertir</text>
<line x1="140" y1="444" x2="1224" y2="444" class="ln"/>

<text x="140" y="474">02 oct 10:14</text><text x="270" y="474">Correccion</text><text x="380" y="474">Lemme · objetivo $0 (paga por fuera)</text>
<text x="690" y="474" class="r">3</text><text x="830" y="474" class="r b mint">+$69.000</text><text x="860" y="474" class="fg2">Davis</text>
<rect x="960" y="460" width="76" height="22" rx="11" fill="#212832"/><text x="998" y="475" class="c xs sb">Aplicada</text>
<rect x="1124" y="454" width="100" height="40" rx="20" class="ol"/><text x="1174" y="479" class="c s sb">Revertir</text>
<line x1="140" y1="506" x2="1224" y2="506" class="ln"/>

<text x="140" y="536">01 oct 16:02</text><text x="270" y="536">Correccion</text><text x="380" y="536">Lemme · $23.000</text>
<text x="690" y="536" class="r">1</text><text x="830" y="536" class="r b rust">-$23.000</text><text x="860" y="536" class="fg2">Davis</text>
<rect x="960" y="522" width="148" height="22" rx="11" fill="#212832"/><text x="1034" y="537" class="c xs sb m">Revertida el 01 oct</text>
<line x1="140" y1="568" x2="1224" y2="568" class="ln"/>
</g>

<!-- Historia del 30 sep -->
<rect x="140" y="586" width="1084" height="64" rx="16" fill="#212832"/>
<text x="160" y="612" class="s sb">Escritas a mano el 30 sep, antes de esta pantalla</text>
<text x="160" y="632" class="xs m">3 movimientos de Lemme y 3 cruces de envio. Se reconocen al corregir (no se cobran dos veces), pero no se revierten desde aqui:</text>
<text x="160" y="646" class="xs m">para deshacerlas, corrige hacia el costo que corresponde.</text>

<text x="140" y="690" class="xs m">3 de 3</text>
</svg>
